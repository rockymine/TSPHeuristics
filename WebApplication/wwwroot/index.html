<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHVis — TSP Heuristics</title>
    <base href="/" />
    <!-- Theme: set data-theme before any CSS loads, so the page never flashes the other theme.
         The reader's stored choice wins; without one the system preference decides. -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem("tsp-theme"); } catch (e) { }
            if (t !== "light" && t !== "dark")
                t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <script src="lib/Chart.js/Chart.min.js"></script>
    <link href="lib/katex/katex.min.css" rel="stylesheet" />

</head>
